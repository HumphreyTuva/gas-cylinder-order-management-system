name: gas_cylinder_app
description: Gas Cylinder Order Tracking and Management System — customer, staff, and management mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Secure JWT storage
  flutter_secure_storage: ^9.2.2

  # JWT decode (read role/expiry from access token)
  jwt_decoder: ^2.0.1

  # Firebase Cloud Messaging (push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # UI helpers
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  fluttertoast: ^8.2.8
  cached_network_image: ^3.4.1

  # Env config
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
